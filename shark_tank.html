html,body{margin:0;height:100%;overflow:hidden;background:#04121a;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#e8f6fb;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
#hud.hide{opacity:0}
.card{position:absolute;left:22px;top:18px;max-width:min(520px,60vw);padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(2,20,30,.62),rgba(2,28,40,.38));backdrop-filter:blur(8px);border:1px solid rgba(160,230,255,.16);box-shadow:0 8px 30px rgba(0,0,0,.25);transition:opacity 1.2s,transform 1.2s}
.card.dim{opacity:.0;transform:translateY(-8px)}
.card h1{margin:0;font-size:24px;font-weight:650;letter-spacing:.2px}
.card .sci{font-style:italic;opacity:.75;margin-top:1px;font-size:14px}
.card .reg{margin-top:8px;font-size:13px;opacity:.88;line-height:1.35}
.card .with{margin-top:8px;font-size:12px;opacity:.7;line-height:1.35}
.status{position:absolute;left:22px;bottom:16px;display:flex;gap:10px;align-items:center;font-size:13px;opacity:.82;padding:7px 14px;border-radius:999px;background:rgba(2,20,30,.5);backdrop-filter:blur(8px);border:1px solid rgba(160,230,255,.14)}
.status b{font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#7fe3ff;box-shadow:0 0 10px #7fe3ff}
.bar{position:absolute;right:16px;top:14px;display:flex;gap:8px;pointer-events:auto}
.btn{cursor:pointer;font:600 12px "Segoe UI",system-ui,sans-serif;color:#e8f6fb;padding:8px 13px;border-radius:999px;background:rgba(2,20,30,.55);backdrop-filter:blur(8px);border:1px solid rgba(160,230,255,.18);transition:background .15s,transform .1s}
.btn:hover{background:rgba(20,70,95,.7)} .btn:active{transform:scale(.96)} .btn.on{background:rgba(30,120,150,.7)}
.menu{position:absolute;right:16px;top:54px;width:270px;display:none;pointer-events:auto;border-radius:14px;overflow:hidden;background:rgba(2,20,30,.86);backdrop-filter:blur(10px);border:1px solid rgba(160,230,255,.2);box-shadow:0 14px 40px rgba(0,0,0,.4)}
.menu.show{display:block}
.menu .item{padding:12px 16px;cursor:pointer;transition:background .12s}
.menu .item+.item{border-top:1px solid rgba(160,230,255,.12)}
.menu .item:hover{background:rgba(40,120,150,.45)}
.menu .item b{display:block;font-size:14px;font-weight:650}
.menu .item span{display:block;font-size:12px;opacity:.72;margin-top:2px;line-height:1.3}
.toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,12px);padding:9px 18px;border-radius:999px;font-size:13px;background:rgba(2,20,30,.72);backdrop-filter:blur(8px);border:1px solid rgba(160,230,255,.2);opacity:0;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.help{position:absolute;right:16px;bottom:16px;font-size:12px;line-height:1.55;opacity:0;padding:12px 16px;border-radius:12px;background:rgba(2,20,30,.7);backdrop-filter:blur(8px);border:1px solid rgba(160,230,255,.16);transition:opacity .25s;pointer-events:none}
.help.show{opacity:.95} .help kbd{background:rgba(255,255,255,.14);border-radius:4px;padding:1px 6px;margin-right:6px;font-family:inherit}
#load{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0a3b4e,#03121a);z-index:10;transition:opacity .9s}
#load.gone{opacity:0;pointer-events:none}
#load .t{font-size:20px;letter-spacing:.5px;font-weight:600} #load .s{opacity:.7;font-size:13px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(160,230,255,.2);border-top-color:#7fe3ff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
